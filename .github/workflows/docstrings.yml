name: Docstrings
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docstrings:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7

      # The rules are in ruff.toml, at the root of the repository.
      - name: Check the docstrings with ruff
        run: uvx ruff@0.14.2 check --output-format=github
